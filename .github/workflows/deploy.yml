name: Deploy Bisca

on:
  push:
    branches:
      - test
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Set environment variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "ENV_UPPER=PROD" >> $GITHUB_OUTPUT
            echo "WEB_PORT=3007" >> $GITHUB_OUTPUT
            echo "WS_PORT=3008" >> $GITHUB_OUTPUT
            echo "BASE_PATH=/bisca" >> $GITHUB_OUTPUT
          else
            echo "ENV=test" >> $GITHUB_OUTPUT
            echo "ENV_UPPER=TEST" >> $GITHUB_OUTPUT
            echo "WEB_PORT=3005" >> $GITHUB_OUTPUT
            echo "WS_PORT=3006" >> $GITHUB_OUTPUT
            echo "BASE_PATH=/test/bisca" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=${{ steps.vars.outputs.BASE_PATH }}" > .env
          # NEXT_PUBLIC_SOCKET_URL is intentionally left unset: the client
          # connects to the same origin that served the page (see
          # resolveSocketUrl in src/hooks/useGameRoom.ts). This keeps the
          # build domain-agnostic — a domain migration needs no rebuild.

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.vars.outputs.BASE_PATH }}

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package

          # Copy standalone build
          shopt -s dotglob
          cp -r .next/standalone/* deploy-package/
          shopt -u dotglob

          # Copy static assets
          mkdir -p deploy-package/.next/static
          cp -r .next/static/* deploy-package/.next/static/

          # Copy public folder if exists
          if [ -d "public" ]; then
            cp -r public deploy-package/
          fi

          # Copy server folder for WebSocket server
          cp -r server deploy-package/

          # Copy package.json for server script
          cp package.json deploy-package/

          # Copy env file
          cp .env deploy-package/.env

          # Debug
          echo "=== Deployment package structure ==="
          ls -la deploy-package/

      # Dal 27/09/2026 la VM accetta solo chiavi SSH: la password non entra più.
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: /var/www/${{ steps.vars.outputs.ENV }}/bisca
          PM2_WEB: bisca-${{ steps.vars.outputs.ENV }}-web
          PM2_SERVER: bisca-${{ steps.vars.outputs.ENV }}-server
          WEB_PORT: ${{ steps.vars.outputs.WEB_PORT }}
          WS_PORT: ${{ steps.vars.outputs.WS_PORT }}
          BASE_PATH: ${{ steps.vars.outputs.BASE_PATH }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

          # bisca non gira più da root (30/09/2026): ha un utente di servizio,
          # «bisca», con un suo PM2. Root prepara la cartella e copia i file;
          # installazione e processi sono dell'utente.
          $SSH "$SSH_USER@$SSH_HOST" "
            id bisca >/dev/null 2>&1 || useradd --system --create-home --home-dir /home/bisca --shell /usr/sbin/nologin bisca
            mkdir -p $DEPLOY_PATH
            # i processi di prima (root, fino al 30/09) e quelli dell'utente
            pm2 delete $PM2_WEB 2>/dev/null || true
            pm2 delete $PM2_SERVER 2>/dev/null || true
            pm2 save >/dev/null 2>&1 || true
            sudo -u bisca -H pm2 delete $PM2_WEB 2>/dev/null || true
            sudo -u bisca -H pm2 delete $PM2_SERVER 2>/dev/null || true
            rm -rf $DEPLOY_PATH/*
          "

          # Copy files to server
          rsync -avz --delete \
            -e "$SSH" \
            deploy-package/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          # Start applications with the bisca user's PM2
          $SSH "$SSH_USER@$SSH_HOST" bash << REMOTESH
          set -e
          # tsx globale: lo installa root, una volta sola
          command -v tsx >/dev/null 2>&1 || npm install -g tsx
          chown -R bisca:bisca $DEPLOY_PATH

          # socket.io in una cartella a parte (il node_modules dello standalone non va con npm)
          sudo -u bisca -H bash -c "cd $DEPLOY_PATH && mkdir -p ws-server && cd ws-server && npm init -y >/dev/null 2>&1 && npm install socket.io >/dev/null 2>&1"

          # WebSocket server (NODE_PATH trova socket.io) e frontend Next, come utente bisca
          sudo -u bisca -H bash -c "cd $DEPLOY_PATH && set -a && . ./.env && set +a && NODE_PATH=$DEPLOY_PATH/ws-server/node_modules PORT=$WS_PORT CLIENT_URL=https://tommasoceschia.com pm2 start tsx --name $PM2_SERVER -- server/index.ts && PORT=$WEB_PORT NODE_ENV=production pm2 start server.js --name $PM2_WEB && pm2 save"
          # riavvio automatico al boot per il PM2 dell'utente (idempotente)
          env PATH="\$PATH" pm2 startup systemd -u bisca --hp /home/bisca >/dev/null 2>&1 || true

          sleep 3
          sudo -u bisca -H pm2 list
          sudo -u bisca -H pm2 logs $PM2_WEB --lines 20 --nostream || true
          sudo -u bisca -H pm2 logs $PM2_SERVER --lines 20 --nostream || true
          REMOTESH

      - name: Configure Nginx
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WEB_PORT: ${{ steps.vars.outputs.WEB_PORT }}
          WS_PORT: ${{ steps.vars.outputs.WS_PORT }}
          BASE_PATH: ${{ steps.vars.outputs.BASE_PATH }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "
            if ! grep -q 'location $BASE_PATH' /etc/nginx/sites-enabled/default; then
              sed -i '/# Default location/i \\
                # bisca WebSocket (port $WS_PORT)\\
                location $BASE_PATH/socket.io/ {\\
                    proxy_pass http://127.0.0.1:$WS_PORT/socket.io/;\\
                    proxy_http_version 1.1;\\
                    proxy_set_header Upgrade \\\$http_upgrade;\\
                    proxy_set_header Connection \"upgrade\";\\
                    proxy_set_header Host \\\$host;\\
                    proxy_set_header X-Real-IP \\\$remote_addr;\\
                    proxy_set_header X-Forwarded-For \\\$proxy_add_x_forwarded_for;\\
                    proxy_set_header X-Forwarded-Proto \\\$scheme;\\
                    proxy_cache_bypass \\\$http_upgrade;\\
                    proxy_read_timeout 86400;\\
                }\\
                \\
                # bisca frontend (port $WEB_PORT)\\
                location $BASE_PATH {\\
                    proxy_pass http://127.0.0.1:$WEB_PORT;\\
                    proxy_http_version 1.1;\\
                    proxy_set_header Upgrade \\\$http_upgrade;\\
                    proxy_set_header Connection upgrade;\\
                    proxy_set_header Host \\\$host;\\
                    proxy_set_header X-Real-IP \\\$remote_addr;\\
                    proxy_set_header X-Forwarded-For \\\$proxy_add_x_forwarded_for;\\
                    proxy_set_header X-Forwarded-Proto \\\$scheme;\\
                    proxy_cache_bypass \\\$http_upgrade;\\
                }\\
              ' /etc/nginx/sites-enabled/default
              nginx -t && systemctl reload nginx
            fi
          "

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          STATUS: ${{ job.status }}
          ENV_NAME: ${{ steps.vars.outputs.ENV }}
          ENV_UPPER: ${{ steps.vars.outputs.ENV_UPPER }}
          BASE_PATH: ${{ steps.vars.outputs.BASE_PATH }}
          COMMIT_SHA: ${{ github.sha }}
          PREV_SHA: ${{ github.event.before }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Get all commits since last deployment
          if [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            COMMIT_COUNT=1
            CHANGES=$(git log -1 --pretty="$'\u2022' %h %s")
          else
            COMMIT_COUNT=$(git rev-list --count ${PREV_SHA}..HEAD 2>/dev/null || echo "1")
            CHANGES=$(git log ${PREV_SHA}..HEAD --pretty="$'\u2022' %h %s" --reverse | head -15)
          fi

          CHANGES=$(echo "$CHANGES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          if [ "$COMMIT_COUNT" -gt 15 ]; then
            CHANGES="${CHANGES}
          ... and $((COMMIT_COUNT - 15)) more commits"
          fi

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS_TEXT="Deploy Successful"
          else
            EMOJI="❌"
            STATUS_TEXT="Deploy Failed"
          fi

          TEXT="${EMOJI} <b>${ENV_UPPER} ${STATUS_TEXT}</b>

          <b>Project:</b> bisca
          <b>Branch:</b> ${ENV_NAME}
          <b>By:</b> ${AUTHOR}
          <b>Commits:</b> ${COMMIT_COUNT}

          <b>Changes:</b>
          ${CHANGES}

          <a href=\"https://github.com/${REPO}/compare/${PREV_SHA}...${COMMIT_SHA}\">View All Changes</a>
          <b>URL:</b> https://tommasoceschia.com${BASE_PATH}/"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
